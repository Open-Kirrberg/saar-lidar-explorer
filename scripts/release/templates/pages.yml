# Build the Saar LiDAR Explorer (+ the Schloss Karlsberg viewer under /castle/) and deploy it to GitHub Pages.
# Data are NOT in this repository: the app loads them from the data repositories' Pages sites (absolute URLs,
# GitHub Pages sends Access-Control-Allow-Origin: *). Generated by scripts/release/export-code.sh.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "{{NODE_VERSION}}"
  PNPM_VERSION: "{{PNPM_VERSION}}"
  SLE_PUBLIC: "1"
  SLE_BASE: "/{{CODE_REPO}}/"
  VITE_DATA_URL: ${{ vars.SLE_DATA_URL || '{{DATA_URL}}' }}
  VITE_AOIS: ${{ vars.SLE_AOIS || '{{AOI}}' }}
  VITE_IMPRESSUM_URL: ${{ vars.SLE_IMPRESSUM_URL || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            zones/schloss-karlsberg/pnpm-lock.yaml

      - name: Explorer – install, test, build (public mode)
        working-directory: app
        env:
          VITE_VIEWER_URL: /{{CODE_REPO}}/castle/
        run: |
          # The explorer type-checks castle sources (V2.7 zone runtime); they resolve `three` from the castle package.
          pnpm --dir ../zones/schloss-karlsberg install --frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build

      # ---- castle viewer under /castle/ (optional: on failure the explorer is rebuilt without the handover) ----
      - name: Castle viewer – texture cache (Poly Haven, CC0)
        uses: actions/cache@v6
        with:
          path: zones/schloss-karlsberg/viewer/public/textures
          key: textures-${{ hashFiles('zones/schloss-karlsberg/viewer/textures.json', 'zones/schloss-karlsberg/scripts/fetch-textures.sh') }}

      - name: Castle viewer – assets and build
        id: castle
        continue-on-error: true
        working-directory: zones/schloss-karlsberg
        env:
          VITE_EXPLORER_URL: /{{CODE_REPO}}/
        run: |
          set -euo pipefail
          bash scripts/fetch-textures.sh
          T=viewer/public/terrain; mkdir -p "$T"
          base="${VITE_DATA_URL%/}/castle-viewer/terrain"
          curl -fsSL --retry 3 -A "saar-lidar-explorer-pages-build" -o "$T/SHA256SUMS" "$base/SHA256SUMS"
          for f in $(awk '{print $2}' "$T/SHA256SUMS"); do
            case "$f" in *[!A-Za-z0-9._-]*) echo "bad name $f"; exit 1;; esac
            curl -fsSL --retry 3 -A "saar-lidar-explorer-pages-build" -o "$T/$f" "$base/$f"
          done
          (cd "$T" && sha256sum -c SHA256SUMS)
          pnpm install --frozen-lockfile
          # GitHub runners are ~2x slower than a dev machine; model-building tests can exceed vitest's 5 s default
          pnpm run test --testTimeout=30000
          pnpm exec tsc --noEmit
          pnpm exec vite build --base "/{{CODE_REPO}}/castle/" --outDir "$GITHUB_WORKSPACE/app/dist/castle" --emptyOutDir

      - name: Explorer – rebuild without the castle handover (viewer build failed)
        if: steps.castle.outcome != 'success'
        working-directory: app
        env:
          VITE_VIEWER_URL: "off"
        run: |
          rm -rf dist
          pnpm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
