<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- F20: viewport-fit=cover + env(safe-area-inset-*) in CSS; page zoom stays allowed (a11y), the
         canvas takes pinch gestures itself via touch-action: none. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14181c" />
    <!-- Root-absolute public file: Vite rewrites it with the build base (./ locally, /saar-lidar-explorer/ public). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Saar LiDAR Explorer</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <!-- v2 shell (src/shell/): HUD, minimap slot, action bar, drawers and „© Quellen“ are built in JS. -->
      <div id="loading" role="status">Lade Gelände …</div>
      <div id="lock-hint" hidden>Maus gefangen · <kbd>Esc</kbd> zum Freigeben</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
