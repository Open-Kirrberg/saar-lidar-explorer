# Captured zone: Bäckerei Heusser, Eckstr. 3, 66424 Homburg-Kirrberg (consented public business, PRD Q-36 / H6).
# Footage: DJI action cam, 4000x3000 @ 29.97 fps, 119 s, wide-angle (fisheye) lens; street -> shop -> courtyard.
[zone]
video = "data/raw/zones/bakery/DJI_0079.MP4"     # untrusted input, never executed
work = "data/work/zones/bakery"

[frames]
analysis_width = 960
step = 0.06           # accumulated median flow between keyframes, fraction of frame width (~480 of 3568)
lo = 0.6
hi = 1.0
max_gap = 30          # frames (1 s)
min_rel_sharp = 0.8

[privacy]
vehicle_conf = 0.3
person_conf = 0.35
small_vehicle_px = 160     # vehicles lower than this are blurred whole
plate_zone_lower = 0.6     # else: the lower 60 % of the vehicle box
pad_frac = 0.15
pad_px = 12
track_max_gap = 3          # keyframes
track_extend = 1
drop_person_frac = 0.03     # drop keyframes where people cover > 3 % of the image ...
# reviewed (privacy/qa_*): live people (staff, passer-by, operator reflection) only up to frame 1240;
# later person hits are portraits, dolls, plants, cushions + faint operator reflections in the counter glass -> blurred, not dropped
people_frames = [[0, 1240]]   # ... but only inside these ranges

[sfm]
camera_model = "OPENCV_FISHEYE"
focal_guess_px = 2000
max_image_size = 2000
max_num_features = 8192
overlap = 12
mapper = "global"

[undistort]
focal_scale = 1.0
jpeg_quality = 92

[mesh]                     # Apple Object Capture (swift/pgtool.swift); one alignment, several LODs
details = ["medium", "reduced"]
ordering = "sequential"
sensitivity = "high"

[georef]
anchor_E = 381467.4        # zone anchor (EPSG:25832): centre of the bakery's LoD2 footprint (picks the zone building)
anchor_N = 5462253.6
radius = 90                # LoD2 walls within this radius take part in the fit
search_radius = 45         # camera centroid must lie within this radius of the anchor
camera_height_m = 1.35     # handheld at chest height -> sets the scale (the facade in view fixes none)
camera_height_tol_m = 0.15 # reported scale uncertainty
theta_step_deg = 1.0
fit_detail = "medium"
dtm_aoi = "overall"        # data/work/<aoi>/dtm.tif for the height datum

[export]
crop_radius_m = 40
crop_below_m = -6          # relative to the DTM ground under the zone
crop_above_m = 25
texture_px = { medium = 4096, reduced = 2048 }
preview_detail = "medium"
