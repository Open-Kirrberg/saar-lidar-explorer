[project]
name = "sle-capture"
version = "0.1.0"
description = "Captured zones: video -> frames -> SfM -> textured mesh -> georeferenced GLB (Saar LiDAR Explorer, ADR 0016/0027)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml==6.1.3",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "pycolmap==4.2.1",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "scipy==1.18.1",
    "trimesh==5.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
