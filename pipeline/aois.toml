# Areas of interest for the pipeline. All coordinates in EPSG:25832 (ETRS89 / UTM 32N), metres.
# bbox = [E_min, N_min, E_max, N_max]; E_min/N_min become the AOI origin (E0, N0) in the manifest.
# Width/height must be multiples of `chunk_size` cells (data contract: 500).
#
# buffer_m: relief derivatives (SLRM r=20 m, SVF/openness r=10 m) are computed on AOI + buffer and
#           then cropped, so there are no edge artefacts. Must be >= 100 m. All 1 km source tiles
#           touching the buffered box (the "buffer ring") are fetched.
# county:   LVGL Landkreis code of the open-data ZIP (SPK = Saarpfalz-Kreis).

[defaults]
buffer_m = 200
county = "SPK"
chunk_size = 500

[karlsberg]
name = "Schloss Karlsberg"
bbox = [381000, 5465000, 384000, 5468000]
phase = "MVP"

[homburg]
name = "Homburg + Schlossberg"
bbox = [378000, 5463000, 381000, 5466000]
phase = "P1"

[kirrberg]
name = "Kirrberg + Merburg"
bbox = [380000, 5460000, 383000, 5463500]
phase = "P1"

[overall]
name = "Homburg / Kirrberg / Karlsberg"
bbox = [378000, 5460000, 384000, 5468000]
phase = "P1"

# Orte im Vergleich (docs/plans/orte-im-vergleich.md): statistics only, no 3D tiles are built or published for it.
# bbox = the nine place outlines (Gemarkungen, places.py) + 200 m, snapped outward to 1 km; places.py rewrites it.
[orte]
name = "Orte im Vergleich (stats only)"
bbox = [375000, 5453000, 387000, 5471000]   # written by places.py: 9 place outlines + 200 m, 1 km grid
phase = "stats"
stats_only = true

# S0 size spike (docs/plans/orte-skalieren-s0.md): the whole municipality Homburg (AGS 10045114, 8 Gemarkungen,
# 82.6 km²). bbox = bounding rectangle of the dissolved INSPIRE Gemarkung outlines, snapped outward to 1 km
# (outline: data/work/homburg-gemeinde/outline.geojson). Local measurement AOI, not published.
[homburg-gemeinde]
name = "Homburg (Gemeinde)"
bbox = [374000, 5456000, 385000, 5472000]
phase = "S0"

# S1 Saarland leaderboard (docs/plans/orte-skalieren.md §6, ADR 0051): Gemeinde level, statistics only (no 3D tiles).
# Publishes app/public/data/saarland/{manifest.json,stats/} (stats-only manifest). bbox = the 52 SL municipalities +
# Zweibrücken + Bechhofen (VG25 outlines, gemeinden.py), snapped outward to 1 km. `./run.sh saarland` runs stats_steps.
[saarland]
name = "Saarland – Gemeinden im Vergleich (stats only)"
bbox = [308000, 5441000, 388000, 5501000]
phase = "stats"
stats_only = true
stats_steps = ["gemeinden", "gemeinde-trees", "gemeinden-stats"]

# F16 point-cloud focus areas (pointcloud.py, contract "Point clouds"). Defined once under [defaults] so every
# AOI inherits them; an AOI writes the areas whose bbox lies fully inside it. bbox in EPSG:25832, multiples of
# 100 m (tileSize), ≈ 1 km² each, placed to touch as few 1 km LAZ tiles as possible.
[[defaults.pointclouds]]
id = "karlsberg-schloss"
name_de = "Schloss Karlsberg"
bbox = [381700, 5465600, 382700, 5466600]   # Hauptschloss ≈ 382195/5466095, Orangerie, Eiskeller, Karlsbergweiher

[[defaults.pointclouds]]
id = "homburg-schlossberg"
name_de = "Homburg Schlossberg (Hohenburg)"
bbox = [379200, 5464000, 380200, 5465000]   # Hohenburg/Vauban-Festung ≈ 379680/5464415, Schlossberghöhlen

[[defaults.pointclouds]]
id = "merburg"
name_de = "Burgruine Merburg"
bbox = [381500, 5463000, 382500, 5464000]   # Merburg ≈ 381964/5463453

# ---------------------------------------------------------------------------------------------------------------
# S2 v3 places (contract "Many places (v3, S2)"): `place` = catalog place id; the rectangle is the bounding box of
# the tiles the catalog assigns to it (catalog.py ownership → data/work/catalog/tile_owners.json), the fetch set
# is those tiles + their 8 neighbours. Optional `tiles` publishes a subset (fixtures; status 'building'); optional
# `out` = output dir below app/public/data (default: the key). `relict_candidates` = ort.toml opt-in (ADR 0053).
# `cache_from` = a rectangle AOI whose raw download caches (OSM, ortho, WMS/WFS) cover the place: reused, no refetch.
# Always manifest version 3: WebP lossless / AVIF chunks, fixed u8 ranges, level 0 + 1, derived relief, no dsm.
# Central catalog (`./run.sh orte-katalog`): ownership, overview levels ≥ 2, sle-catalog-v1 into
# app/public/data/orte-katalog/ (catalog.json, overview/). No place tiles; bbox informative (catalog area).
[orte-katalog]
name = "Orte-Katalog (catalog + central overview)"
bbox = [308000, 5441000, 388000, 5501000]
stats_only = true
stats_steps = ["catalog"]

[ort-homburg]
name = "Homburg"
place = "homburg"
relict_candidates = true
cache_from = "homburg-gemeinde"
phase = "S2"

# Shared S2 fixture (app/public/data/fixture-v3/, README.md there): the Homburg/Kirkel border near Limbach,
# two interlocking L-shaped places of 3 tiles each (each a 2 × 2 km rectangle with one absent tile).
[fixture-v3]
name = "S2 fixture (two v3 places + catalog + overview)"
group = ["fixture-v3-homburg", "fixture-v3-kirkel"]
after = ["fixture"]   # fixture_v3.py: overview + catalog + README into app/public/data/fixture-v3/

[fixture-v3-homburg]
name = "Homburg (Fixture v3)"
place = "homburg"
tiles = ["376_5462", "377_5462", "377_5463"]
out = "fixture-v3/homburg"
relict_candidates = true
cache_from = "homburg-gemeinde"
phase = "S2"

[fixture-v3-kirkel]
name = "Kirkel (Fixture v3)"
place = "kirkel"
tiles = ["375_5462", "375_5463", "376_5463"]
out = "fixture-v3/kirkel"
cache_from = "homburg-gemeinde"
phase = "S2"
