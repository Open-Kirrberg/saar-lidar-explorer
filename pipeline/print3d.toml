# F21 3D-Druck — print series for print3d.py (contract: docs/data-contract.md "3D print tiles").
#
# A *series* is a set of square tiles on a GLOBAL grid in EPSG:25832 that all share scale, exaggeration,
# datum rule and base, so any two tiles of the same series (and the same datum) join seamlessly (identical edge
# heights) — also tiles generated later anywhere else ("other parts"). Never change scale/tile_m/exag/datum/base_mm/
# origin/vertices of a series that already has printed tiles: create a new series key instead. Name a series after its
# scale (saarpfalz-9200 = 1:9200) so the key never lies about the print.
#
#   tile edge in print   = tile_m / scale · 1000 mm          (derived; an explicit tile_mm must match)
#   grid                 = tile lower-left corner E, N ≡ origin (mod tile_m)
#   tile id              = "E{E/1000}_N{N/1000}" (km, decimals only when needed: E382.5_N5466)
#   vertex grid          = `vertices` × `vertices` incl. both edges, cell = tile_m / (vertices − 1); the printed top
#                          surface is simplified to max_error_mm at every vertex (edges kept → seams stay exact)
#   z_mm                 = base_mm + (max(h, datum) − datum) / scale · 1000 · exag   (h incl. LoD2 roofs, `buildings`)
#   datum_mode "series"  → datum = datum_m for every tile
#   datum_mode "set"     → datum per named set = floor(min h of the set) − datum_margin_m, recorded in index.json
#                          (setDatum_m) and frozen; tiles of an overlapping / nested set adopt it
#
# Printer: Bambu Lab P1S 0.4, plate 256 × 256 mm, printable height 250 mm. printer = "stock" (default) must slice
# with the UNMODIFIED profile AS OPENED IN THE BAMBU STUDIO GUI: the GUI ignores the 3MF position and centres the tile,
# and refuses any object whose outline touches the front-left exclusion area (18 × 28 mm) — a centred square must stay
# below 220 mm; with a 1 mm margin < 218 mm. Hence 1:9200 (2 km → 217.39 mm) and 1:2300 for 500 m. (The former
# 1:8500 / 235.29 mm series sliced in the CLI at X 19.4 but was refused in the GUI after centring — never printed.)
# printer = "sle-250" (only for 250 mm tiles) needs the user printer preset print3d.py writes (see README).

[defaults]
vertices = 1001              # per edge, incl. both edges (1000 cells)
exag = 2.0
datum_mode = "series"
datum_m = 180.0              # m NHN (DHHN2016); identical for every tile of a "series"-datum series
datum_margin_m = 5.0         # "set" datum: whole metres below the lowest vertex of the set, minus this
base_mm = 4.0                # plate thickness below the datum level
origin = [0, 0]              # grid origin E, N (m)
printer = "stock"            # "stock" | "sle-250"
role = "main"                # catalog hint for the app: "main" | "detail" | "single" (standalone piece)
title = ""                   # optional name engraved large on the bottom (A–Z 0–9, no umlauts, ≤ 16 chars)
rlp_offset_m = -0.07         # added to RLP 2022 heights where SL 2025 has no data (README "Data notes"); a
                             # constant, never measured per tile, so neighbours stay bit-identical
counties = ["SPK"]           # LVGL county ZIPs tried first; other Saarland counties are tried automatically
                             # only for 1 km tiles that neither these ZIPs nor RLP cover
max_height_mm = 250.0        # warn above this (P1S printable_height 250 mm; must not exceed it)
text = true                  # engrave id/series/scale/N-arrow into the bottom face
engrave_mm = 0.6
material_density_g_cm3 = 1.24   # PLA
shell_mm = 0.9               # filament estimate for the stock process (grid 15 %, 2 walls): ρ·(S + infill·(V − S)),
infill = 0.155               #   S = A·shell_mm — least-squares fit to the 19 sliced tiles, max error 2 % (was 1.2 / 0.15:
                             #   6–14 % too high)
max_error_mm = 0.03          # top surface simplified: every sampled vertex within 0.03 mm (≈ 1/7 of a 0.2 mm layer)
max_triangles = 900000       # top-surface triangle budget (Bambu Studio warns above 1 M per object; walls + bottom add
                             # ≈ 10–20 k). Was 500 k for bare earth (max 458 k); LoD2 walls need every vertex along both
                             # edges of each wall step: Homburg E378_N5464 needs 562 k at 0.03 mm
buildings = true             # LoD2 buildings in the heightfield: h = max(DGM, roof) at vertices inside a building's top
                             # view, same datum / scale / exag as the terrain; `--no-buildings` (or false here per
                             # series) writes bare-earth tiles. Not a geometry parameter of the grid: footprint, datum,
                             # keys and seams with bare tiles stay (edges differ only where a building crosses them)
building_min_feature_mm = 0.8   # grey-scale opening of the LoD2 surface with a disk of ceil(0.8 / cell_mm) = 4 cells:
                             # at every height level, parts narrower than ≈ 0.8 mm in the print (0.4 mm nozzle) are
                             # removed or cut down to the wider part below — 8 m at 1:9200, 2 m at 1:2300

[defaults.connectors]
enabled = true               # bowtie (double dovetail) key recesses on the bottom face
positions = [0.25, 0.75]     # along every edge, fraction of the edge length
depth_mm = 2.0               # recess depth into the bottom (each half)
length_mm = 10.0             # half-key length into the tile (perpendicular to the edge)
waist_mm = 8.0               # width at the tile edge (narrow neck)
end_mm = 14.0                # width at the inner end (dovetail undercut)
clearance_mm = 0.15          # key outline offset inwards per side; key thickness = depth − clearance
min_base_mm = 2.0            # material required above a recess (checked per tile)

# Recommended Bambu Studio process changes against the stock "0.20mm Standard @BBL X1C" (grid 15 %, 2 walls, 5 top
# layers / 1.0 mm). Display only: a plain 3MF cannot carry process settings into the GUI (README "Filament"), so the
# app planner and index.json `slicer` show them. Measured with the Bambu Studio 02.08.02.61 CLI on all 19 tiles
# (stock P1S 0.4 + Bambu PLA Basic); not a geometry parameter — changing it never breaks joins.
[defaults.slicer]
sparse_infill_pattern = "lightning"   # supports only the (terrain) top surface — the block below it stays hollow
sparse_infill_density = 0.10
wall_loops = 3               # the hollow block's side walls and the key-recess walls get no infill backing
top_shell_layers = 6         # 1.2 mm skin over the sparse lightning branches (against pillowing)
top_shell_thickness_mm = 1.2
saving_pct = [24, 55]        # filament saved vs. the stock process (min/max over the 19 tiles; thick tiles save most)
time_saving_pct = [-3, 22]   # print time saved (Bambu estimate; thin detail tiles up to 3 % slower)
shell_mm = 1.25              # filament estimate for these settings: ρ·(S + infill·(V − S)), S = A·shell_mm
infill = 0.02                #   (least-squares fit to the 19 sliced tiles, max error 6 %)

# Main series: stock P1S profile, tile centred on the plate (X/Y 19.30–236.70 mm).
[series.saarpfalz-9200]
name_de = "Saarpfalz 1:9200"
scale = 9200
tile_m = 2000                # 2 km → 217.39 mm; overall explorer area = 3 × 4 tiles ≈ 65.2 × 87.0 cm

[series.saarpfalz-9200.sets]
explorer = { bbox = [378000, 5460000, 384000, 5468000] }   # = aois.toml [overall]
extension-west = ["E376_N5462"]                            # first "other part": west of Homburg (Bexbach/Kirkel)

# Detail series: 500 m tiles, exactly 4 × the main scale (same 217.39 mm tile, same plate placement), local datum per
# set so a showpiece is ≈ 30–65 mm tall instead of 100–175 mm with datum 180 m.
[series.detail-2300]
name_de = "Detail 1:2300"
role = "detail"
scale = 2300
tile_m = 500                 # 500 m → 217.39 mm, cell 0.5 m (1 m DGM, area mean = bilinear at 0.5 m)
exag = 1.5
datum_mode = "set"

[series.detail-2300.sets]
karlsberg = ["E382_N5465.5", "E382_N5466"]                 # Hauptschloss 382195/5466095 + Orangerie 382229/5465983 at the shared edge
merburg = ["E381.5_N5463", "E382_N5463", "E381.5_N5463.5", "E382_N5463.5"]   # Merburg 381964/5463453 near the common corner

# Single showpiece: the village of Kirrberg as ONE tile (standalone, joins nothing). Built-up extent (LoD2 building
# cluster around the church, = OSM landuse=residential 47225604): E 380553–382467, N 5461407–5463480 (1.91 × 2.07 km);
# framed with ≈ 250 m (E/W) / 160 m (N/S) of fields and forest, Fischweiher 381863/5463533 + Merburg 381964/5463453
# in the north, bunker ruin 382118/5461504 in the south. 2.4 km at 1:11050 → 217.19 mm (stock P1S, centred; < 218 mm).
# 2.4 km instead of 2.5 km (1:11500): LoD2 houses ≥ 100 m² survive the 0.8 mm opening to 95 % instead of 91 %
# (all buildings 57 % vs 52 %; 1:10580 / 2.3 km: 98 % but only ≈ 110 m margin and the pond at the edge).
# exag 1.5: the valley (236–367 m) still reads (≈ 18 mm), houses (same exag) stay house-shaped instead of towers.
# Own origin = the tile's lower-left corner, so the series grid is centred on the village; datum per set
# (floor(min h) − 5 m), no bowtie keys (nothing to join), "KIRRBERG" engraved on the bottom.
[series.kirrberg-11050]
name_de = "Kirrberg 1:11050"
role = "single"
title = "Kirrberg"
scale = 11050
tile_m = 2400                # 2.4 km → 217.19 mm, cell 2.4 m
origin = [380300, 5461250]   # tile E380.3_N5461.25 = 380300–382700 / 5461250–5463650, centre ≈ village centre
exag = 1.5
datum_mode = "set"

[series.kirrberg-11050.connectors]
enabled = false              # standalone piece: no key recesses

[series.kirrberg-11050.slicer]
saving_pct = [12, 12]        # measured on this tile (Bambu Studio 02.08.02.61 CLI, stock P1S 0.4, centred): 221.5 →
time_saving_pct = [-9, -9]   #   193.8 g, 7 h 31 → 8 h 09 — a thin tile (z 4.8–22.7 mm) saves little and prints slower

[series.kirrberg-11050.sets]
kirrberg = ["E380.3_N5461.25"]

# OPTIONAL, not generated: the former 250 mm / 1:8000 main series. A 250 mm tile does NOT fit the stock P1S profile;
# printer = "sle-250" writes a user printer preset that moves the exclusion area to a 5 mm front strip and frees the
# 18 × 28 mm front-left corner — Bambu does not document why that corner is excluded, so this is at your own risk
# (print a small test tile first). The GUI centres the tile on import: set its position by hand (README). Tiles of
# this series do not join 1:9200 tiles.
